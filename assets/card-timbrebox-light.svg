<svg xmlns="http://www.w3.org/2000/svg" width="400" height="210" viewBox="0 0 400 210" role="img" aria-label="TimbreBox: Music from public sources, no login">
  <defs><style>
      .name { fill: #0a8a4a; font: 700 30px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .en { fill: #1f6f8b; font: 500 15px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .zh { fill: #1f6f8b; font: 500 17px system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; opacity: .8; }
      .go { fill: #0a8a4a; font: 700 18px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
             animation: nudge 1.6s ease-in-out infinite; }
      .px { animation: twinkle 4s ease-in-out infinite; }
      .edge { fill: none; stroke: #0a8a4a; stroke-width: 2; stroke-dasharray: 10 6; opacity: .55;
               animation: march 12s linear infinite; }
      @keyframes twinkle { 0%, 80%, 100% { opacity: 1; } 88% { opacity: .35; } }
      @keyframes nudge { 50% { transform: translateX(5px); } }
      @keyframes march { to { stroke-dashoffset: -160; } }
      @media (prefers-reduced-motion: reduce) { .px, .go, .edge { animation: none; } }
  </style></defs>
