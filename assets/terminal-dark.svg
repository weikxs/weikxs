  <defs><style>
      .chrome { fill: #12302a; }
      .title { fill: #7fe9ff; font: 500 16px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; opacity: .8; }
      .prompt, .line { font: 500 21px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .prompt { fill: #43ff88; }
      .cmd { fill: #7fe9ff; }
      .typed { clip-path: inset(0 100% 0 0); animation: type 0.9s steps(10) forwards; }
      .line { opacity: 0; animation: in .3s ease-out forwards; }
      .head { fill: #43ff88; font-weight: 700; }
      .key { fill: #43ff88; }
      .val { fill: #7fe9ff; }
      .eye { transform-box: fill-box; transform-origin: center; animation: wink 5s steps(1) infinite; }
      .cursor { fill: #43ff88; animation: blink 1.1s steps(1) infinite; }
      @keyframes type { to { clip-path: inset(0 0 0 0); } }
      @keyframes in { from { opacity: 0; transform: translateX(-6px); } to { opacity: 1; transform: none; } }
      @keyframes blink { 50% { opacity: 0; } }
      @keyframes wink { 0%, 92%, 100% { transform: none; } 94% { transform: scaleY(.15); } }
      @media (prefers-reduced-motion: reduce) {
        .typed { animation: none; clip-path: none; }
        .line { animation: none; opacity: 1; }
        .eye { animation: none; }
        .cursor { animation: none; }
      }
  </style></defs>
