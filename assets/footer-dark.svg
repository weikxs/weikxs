  <rect class="dot" x="284" y="44" width="8" height="8" rx="2" fill="#c98a4b" style="animation-name:eat4"/>
  <rect class="dot" x="344" y="44" width="8" height="8" rx="2" fill="#c98a4b" style="animation-name:eat5"/>
  <rect class="dot" x="404" y="44" width="8" height="8" rx="2" fill="#c98a4b" style="animation-name:eat6"/>
