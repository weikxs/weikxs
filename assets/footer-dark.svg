  <rect class="dot" x="1124" y="44" width="8" height="8" rx="2" fill="#c98a4b" style="animation-name:eat18"/>
  <g class="snake">
    <rect x="-20" y="40" width="16" height="16" rx="3" fill="#43ff88" opacity="1.00"/>
    <rect x="-40" y="40" width="16" height="16" rx="3" fill="#43ff88" opacity="0.89"/>
    <rect x="-60" y="40" width="16" height="16" rx="3" fill="#43ff88" opacity="0.78"/>
    <rect x="-80" y="40" width="16" height="16" rx="3" fill="#43ff88" opacity="0.67"/>
