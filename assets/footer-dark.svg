  <rect class="dot" x="884" y="44" width="8" height="8" rx="2" fill="#c98a4b" style="animation-name:eat14"/>
  <rect class="dot" x="944" y="44" width="8" height="8" rx="2" fill="#c98a4b" style="animation-name:eat15"/>
