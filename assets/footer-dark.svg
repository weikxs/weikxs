    <rect x="-120" y="40" width="16" height="16" rx="3" fill="#43ff88" opacity="0.45"/>
    <rect x="-140" y="40" width="16" height="16" rx="3" fill="#43ff88" opacity="0.34"/>
  </g>
  <text class="msg" x="600" y="102" text-anchor="middle"><tspan class="prompt">› </tspan>thanks for stopping by · 感谢来访</text>
</svg>
