<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="120" viewBox="0 0 1200 120" role="img" aria-label="A pixel snake eating dots; thanks for stopping by">
  <defs><style>
      .snake { animation: crawl 10s steps(67) infinite; }
      .dot { animation-duration: 10s; animation-timing-function: steps(1); animation-iteration-count: infinite; }
      .msg { fill: #7fe9ff; font: 500 18px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 3px; }
      .prompt { fill: #43ff88; }
      .cursor { fill: #43ff88; animation: blink 1.1s steps(1) infinite; }
      @keyframes crawl { from { transform: translateX(0); } to { transform: translateX(1340px); } }
      @keyframes eat0 { 0%, 4.5% { opacity: 1; } 4.6%, 100% { opacity: 0; } }
      @keyframes eat1 { 0%, 9.0% { opacity: 1; } 9.1%, 100% { opacity: 0; } }
      @keyframes eat2 { 0%, 13.4% { opacity: 1; } 13.5%, 100% { opacity: 0; } }
      @keyframes eat3 { 0%, 17.9% { opacity: 1; } 18.0%, 100% { opacity: 0; } }
      @keyframes eat4 { 0%, 22.4% { opacity: 1; } 22.5%, 100% { opacity: 0; } }
      @keyframes eat5 { 0%, 26.9% { opacity: 1; } 27.0%, 100% { opacity: 0; } }
      @keyframes eat6 { 0%, 31.3% { opacity: 1; } 31.4%, 100% { opacity: 0; } }
      @keyframes eat7 { 0%, 35.8% { opacity: 1; } 35.9%, 100% { opacity: 0; } }
      @keyframes eat8 { 0%, 40.3% { opacity: 1; } 40.4%, 100% { opacity: 0; } }
      @keyframes eat9 { 0%, 44.8% { opacity: 1; } 44.9%, 100% { opacity: 0; } }
      @keyframes eat10 { 0%, 49.3% { opacity: 1; } 49.4%, 100% { opacity: 0; } }
      @keyframes eat11 { 0%, 53.7% { opacity: 1; } 53.8%, 100% { opacity: 0; } }
      @keyframes eat12 { 0%, 58.2% { opacity: 1; } 58.3%, 100% { opacity: 0; } }
      @keyframes eat13 { 0%, 62.7% { opacity: 1; } 62.8%, 100% { opacity: 0; } }
      @keyframes eat14 { 0%, 67.2% { opacity: 1; } 67.3%, 100% { opacity: 0; } }
      @keyframes eat15 { 0%, 71.6% { opacity: 1; } 71.7%, 100% { opacity: 0; } }
      @keyframes eat16 { 0%, 76.1% { opacity: 1; } 76.2%, 100% { opacity: 0; } }
      @keyframes eat17 { 0%, 80.6% { opacity: 1; } 80.7%, 100% { opacity: 0; } }
      @keyframes eat18 { 0%, 85.1% { opacity: 1; } 85.2%, 100% { opacity: 0; } }
      @keyframes blink { 50% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) {
        .snake, .cursor { animation: none; }
        .dot { animation: none; opacity: 1; }
      }
  </style></defs>
  <rect class="dot" x="44" y="44" width="8" height="8" rx="2" fill="#c98a4b" style="animation-name:eat0"/>
  <rect class="dot" x="104" y="44" width="8" height="8" rx="2" fill="#c98a4b" style="animation-name:eat1"/>
  <rect class="dot" x="164" y="44" width="8" height="8" rx="2" fill="#c98a4b" style="animation-name:eat2"/>
