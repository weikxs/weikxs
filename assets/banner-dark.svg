  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#12302a" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feFlood flood-color="#43ff88" flood-opacity="0.45"/>
      <feComposite in2="b" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .p { fill: var(--px, #43ff88); opacity: 0; animation: in .35s ease-out forwards; }
      .p.coffee { fill: #c98a4b; }
      .cursor { fill: #43ff88; animation: blink 1.1s steps(1) infinite; }
      .steam { fill: #b9f6ff; opacity: 0; animation: steam 2.1s ease-in infinite; }
      .tag { fill: #7fe9ff; font: 500 22px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
              letter-spacing: 4px; opacity: 0; animation-name: rotate; animation-iteration-count: infinite;
              animation-timing-function: ease-out; }
      .prompt { fill: #43ff88; }
      .split-a, .split-b { opacity: 0; animation: glitch 7s steps(1) infinite; }
      .split-a { --dx: -5px; --px: #ff2e88; }
      .split-b { --dx: 5px; --px: #2ee6ff; animation-delay: .05s; }
      .word { animation: jitter 7s steps(1) infinite; }
      @keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
      @keyframes blink { 50% { opacity: 0; } }
      @keyframes steam { 0% { opacity: 0; transform: translateY(0); } 30% { opacity: .8; }
                          100% { opacity: 0; transform: translateY(-34px); } }
      @keyframes rotate { 0% { opacity: 0; transform: translateY(8px); } 3.0% { opacity: 1; transform: none; }
                           21.2% { opacity: 1; transform: none; } 25.0% { opacity: 0; transform: translateY(-8px); }
                           100% { opacity: 0; } }
      @keyframes glitch { 0%, 90% { opacity: 0; transform: none; } 91% { opacity: .75; transform: translateX(var(--dx)); }
                           93% { opacity: .6; transform: translate(calc(var(--dx) * -0.6), 2px); } 95%, 100% { opacity: 0; transform: none; } }
      @keyframes jitter { 0%, 90% { transform: none; } 91% { transform: translateX(2px); } 93% { transform: translateX(-3px); } 95%, 100% { transform: none; } }
      @media (prefers-reduced-motion: reduce) {
        .p { animation: none; opacity: 1; }
        .cursor, .word { animation: none; }
        .steam, .split-a, .split-b { display: none; }
        .tag { animation: none; }
        .tag:first-of-type { opacity: 1; }
      }
    </style>
